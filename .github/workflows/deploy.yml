name: deploy

on:
  push:
    branches: [main]
    # This resets /root/gaia to origin/main on the VPS unconditionally —
    # scoped to gaia-api's own path so a docs/proxy/cognition-only push
    # doesn't also reset the checkout for no reason. (A push that touched
    # gaia-api *and* something else still runs — paths filters are OR'd
    # against the changed files, not AND'd.)
    paths:
      - 'services/gaia-api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gaia-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/gaia-api/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Public SSH on the VPS is closed — the runner joins the tailnet
      # first so it can reach the box on its Tailscale IP instead.
      # DEPLOY_HOST must be set to 100.65.0.15.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Deploy gaia-api on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          # reset --hard keeps the checkout identical to origin; .env files
          # are gitignored and therefore untouched.
          script: |
            set -e
            cd /root/gaia
            git fetch --all
            git reset --hard origin/main

            # foundation-artifact.json for gaia-api's context-aware document
            # selection (docs/web-migration-plan.md Phase B) — same
            # generator publish-foundation.yml uses, materialized here
            # rather than widening gaia-api's own build context back to
            # the repo root.
            node scripts/build-foundation-artifact.js
            cp foundation-artifact.json services/gaia-api/foundation-artifact.json

            cd services/gaia-api
            node scripts/generate-build-meta.js
            docker compose up -d --build
            docker image prune -f
            docker compose ps
