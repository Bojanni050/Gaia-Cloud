services:
  gaia-api:
    build:
      # This service's own directory — identity/soul.md lives right here
      # (centralized in Gaia Cloud, versioned; see docs/evolution.md),
      # so nothing outside services/gaia-api/ is needed at build time.
      context: .
      dockerfile: Dockerfile
    container_name: gaia-api
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persists providerStore.js's saved provider key + role models
      # (set via /admin) across redeploys/restarts. Without this
      # volume the admin config is lost on every container recreation —
      # the same class of trap as any other untracked state on the VPS.
      - ./data:/app/data
    ports:
      # Tailscale-only, same posture as Hindsight and gaia-cognition:
      # reachable from the tailnet (desktop clients live there), never
      # exposed to the open internet. Auth is the bearer token.
      - "${GAIA_API_HOST:-100.65.0.15}:8891:8891"
    networks:
      - default
      - hermes_net
      # Cognition runs in its own compose stack (gaia-cognition +
      # gaia-cognition-db, project "gaia-cognition", so its default network
      # is gaia-cognition_default). Joining that external network lets
      # gaia-api reach it by container name — COGNITION_URL=
      # http://gaia-cognition:8890 — exactly like Hermes.
      - cognition_net

networks:
  hermes_net:
    # hermes-agent binds only to its own docker network; gaia-api reaches
    # it by container name (http://hermes:8642/v1), exactly like
    # gaia-hermes-proxy does. Attach to that same external network.
    external: true
    name: hermes-agent_default
  cognition_net:
    external: true
    # Compose names a stack's default network <project>_<service>_default.
    # The running cognition stack uses project "gaia-cognition" (the directory)
    # and service "gaia_cognition", so the network is
    # gaia-cognition_gaia_cognition_default — confirmed on the VPS with
    # `docker inspect gaia-cognition --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'`.
    # If the stack is ever recreated under a different project/service name,
    # update this to match or gaia-api cannot join it.
    name: gaia-cognition_gaia_cognition_default
